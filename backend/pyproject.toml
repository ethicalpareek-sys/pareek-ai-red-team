[project]
name = "pareek-ai-red-team"
version = "1.0.0"
description = "Authorized AI-powered web application security assessment platform"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.6",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.5.2",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.29.0",
  "redis>=5.1.1",
  "celery>=5.4.0",
  "httpx>=0.27.2",
  "beautifulsoup4>=4.12.3",
  "aiohttp>=3.10.10",
  "python-dotenv>=1.0.1",
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "alembic>=1.14.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
